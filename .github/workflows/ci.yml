name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # next build does not lint in Next 16; run it here so it runs somewhere.
      - run: npm run lint
      # Coverage thresholds live in vitest.config.mts; this fails when they slip.
      - run: npm run test:coverage
      - run: npm run build
