name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # next build does not lint in Next 16; run it here so it runs somewhere.
      - run: npm run lint
      # Coverage thresholds live in vitest.config.mts; this fails when they slip.
      - run: npm run test:coverage
      - run: npm run build
