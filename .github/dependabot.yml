version: 2
updates:
  # Actions are pinned to commit SHAs in the workflows (tags are mutable);
  # Dependabot keeps the SHAs and the version comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    ignore:
      # TypeScript 7: Next.js 16.2.x build refuses it ("does not provide
      # the compiler API required by Next.js"). Remove once Next.js
      # supports TypeScript 7 without the experimental flag.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
